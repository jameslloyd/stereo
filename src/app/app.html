<div class="hifi-app-container">
  <main class="rack-cabinet" [class]="'rack-cabinet theme-' + vfdSettings.theme()">
    <div class="rack-stack">
      <!-- Separate 1: 24-Band Stereo Spectrum Analyzer (GE-2400) -->
      <section class="rack-unit-slot analyzer-slot">
        <app-spectrum-analyser></app-spectrum-analyser>
      </section>

      <!-- Separate 2: Compact Disc Player Deck (DP-2400) -->
      <section class="rack-unit-slot deck-slot">
        <app-player-bar
          [queueOpen]="showQueueDrawer()"
          (openJellyfin)="openJellyfin()"
          (toggleQueue)="toggleQueue()"
        ></app-player-bar>
      </section>

      <!-- Separate 3: Stereo Synthesizer Radio Tuner (KT-2400) -->
      <section class="rack-unit-slot tuner-slot">
        <app-radio-tuner></app-radio-tuner>
      </section>
    </div>
  </main>

  <!-- Modals & Drawers -->
  @if (showJellyfinModal()) {
    <app-jellyfin-browser (close)="closeJellyfin()"></app-jellyfin-browser>
  }

  @if (showQueueDrawer()) {
    <app-queue-drawer (close)="toggleQueue()"></app-queue-drawer>
  }
</div>
