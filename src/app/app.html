<div class="hifi-app-container">
  <main class="rack-cabinet">
    <div class="rack-stack">
      <!-- Top Component Header Strip -->
      <header class="rack-top-strip">
        <div class="system-branding">
          <span class="system-logo">KENWOOD</span>
          <span class="system-tagline">SERIES 2400 HI-FI STEREO COMPONENT SYSTEM • 24-CHANNEL SEPARATES</span>
        </div>

        <div class="top-nav-actions">
          <!-- Audio context / state badge -->
          <div class="badge-pill" [class.live]="audioEngine.isPlaying()">
            <span class="pill-dot"></span>
            <span>{{ audioEngine.isPlaying() ? 'AUDIO ACTIVE' : 'STANDBY' }}</span>
          </div>

          <!-- Jellyfin Server Status Pill -->
          <button
            type="button"
            class="badge-pill clickable"
            [class.connected]="jellyfin.connectionStatus() === 'connected'"
            (click)="openJellyfin()"
            title="Open Jellyfin Server Browser"
          >
            <span class="pill-dot jellyfin"></span>
            <span>JELLYFIN: {{ jellyfin.connectionStatus() | uppercase }}</span>
          </button>

          <!-- Queue Drawer Toggle -->
          <button
            type="button"
            class="badge-pill clickable"
            [class.active]="showQueueDrawer()"
            (click)="toggleQueue()"
            title="Toggle Playback Queue"
          >
            <span class="icon">≡</span>
            <span>QUEUE ({{ audioEngine.queue().length }})</span>
          </button>
        </div>
      </header>

      <!-- Separate 1: 24-Band Stereo Spectrum Analyzer (GE-2400) -->
      <section class="rack-unit-slot analyzer-slot">
        <app-spectrum-analyser></app-spectrum-analyser>
      </section>

      <!-- Separate 2: Compact Disc Player Deck (DP-2400) -->
      <section class="rack-unit-slot deck-slot">
        <app-player-bar (openJellyfin)="openJellyfin()"></app-player-bar>
      </section>

      <!-- Separate 3: Stereo Synthesizer Radio Tuner (KT-2400) -->
      <section class="rack-unit-slot tuner-slot">
        <app-radio-tuner></app-radio-tuner>
      </section>
    </div>
  </main>

  <!-- Modals & Drawers -->
  @if (showJellyfinModal()) {
    <app-jellyfin-browser (close)="closeJellyfin()"></app-jellyfin-browser>
  }

  @if (showQueueDrawer()) {
    <app-queue-drawer (close)="toggleQueue()"></app-queue-drawer>
  }
</div>
